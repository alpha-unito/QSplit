name: Run Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Local tests (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Install local test dependencies
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv pip install -e ".[dev,streamflow,quantinuum,dataset]"
      - name: Record platform and dependency versions
        run: |
          mkdir -p reports
          uv run --no-sync python -c "import platform; print(platform.platform()); print(platform.machine()); print(platform.python_version())" > reports/platform.txt
          uv pip freeze > reports/dependencies.txt
      - name: Verify optional local dependencies import successfully
        run: uv run --no-sync python -c "import streamflow.main, pytket.extensions.qiskit, pennylane"
      - name: Lint and format
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Unit tests and unit coverage
        run: >-
          uv run --no-sync python -m pytest -m "unit and not iqm and not cudaq"
          --junitxml=reports/unit.xml --cov
          --cov-report=term-missing --cov-report=json:reports/coverage-unit.json
      - name: Integration tests (CPU simulators)
        run: >-
          uv run --no-sync python -m pytest -m "integration and not iqm and not cudaq"
          --junitxml=reports/integration.xml --cov --cov-append
          --cov-report=term-missing --cov-report=json:reports/coverage-unit-integration.json
      - name: End-to-end CLI and local StreamFlow workflows (2 CPUs)
        run: |
          e2e_cpus=$(uv run --no-sync python -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:2])))')
          taskset --cpu-list "$e2e_cpus" uv run --no-sync python -m pytest -m e2e \
            --basetemp=reports/e2e-work --junitxml=reports/e2e.xml \
            --cov --cov-append --cov-fail-under=75 \
            --cov-report=term-missing --cov-report=xml:reports/coverage.xml \
            --cov-report=json:reports/coverage.json --cov-report=html
      - name: Upload test results and cumulative coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-test-reports-${{ matrix.os }}
          include-hidden-files: true
          path: |
            reports/
            htmlcov/
            .coverage

  optional-simulators:
    name: ${{ matrix.extra }} CPU simulator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # IQM conflicts with StreamFlow/Quantinuum; CUDA-Q wheels require Linux.
        include:
          - extra: iqm
            module: iqm.qiskit_iqm
            os: ubuntu-latest
          - extra: cudaq
            module: cudaq
            os: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Install isolated simulator dependencies
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv pip install -e ".[dev,${{ matrix.extra }}]"
      - name: Verify simulator is installed
        run: uv run --no-sync python -c "import ${{ matrix.module }}"
      - name: Run simulator tests
        run: >-
          uv run --no-sync python -m pytest tests/integration -m ${{ matrix.extra }}
          --junitxml=reports/${{ matrix.extra }}.xml --cov
          --cov-report=term-missing --cov-report=xml:reports/coverage-${{ matrix.extra }}.xml
      - name: Upload simulator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-${{ matrix.extra }}-${{ matrix.os }}-reports
          path: reports/
