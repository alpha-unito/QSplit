name: Run Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Run linter
        run: uv run --extra dev ruff check .

      - name: Run formatter
        run: uv run --extra dev ruff format --check .

      - name: Run tests
        run: uv run --extra dev python -m pytest --cov=qsplit tests/ --cov-report term-missing