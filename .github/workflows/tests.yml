name: Run Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Set up Python
        run: |
          uv python install 3.12
          uv pip install -e ".[dev]"

      - name: Run linter
        run: uv run --no-sync ruff check .

      - name: Run formatter
        run: uv run --no-sync ruff format --check .

      - name: Run tests
        run: uv run --no-sync python -m pytest --cov=qsplit tests/ --cov-report term-missing