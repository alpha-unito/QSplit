[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qsplit"
version = "0.1.0"
description = "TODO"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["dwave-system>=1.34.0",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "scipy>=1.16.3",
]

[dependency-groups]
dev = ["pytest>=9.0.1",
    "pytest-cov>=7.0.0",
]

[tool.setuptools.packages]
find = {include = ["qsplit*"]}
