[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qsplit"
version = "0.1.0"
description = "TODO"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["numpy>=2.3.4",
    "pandas>=2.3.3",
    "scipy>=1.16.3",
]

[project.optional-dependencies]

ibm-quantum = ["qiskit>=2.2.3",
    "qiskit-ibm-runtime>=0.43.1"]

dwave = ["dwave-system>=1.34.0"]

ibm-cpu = ["qiskit>=2.2.3", "qiskit-aer>=0.17.2"]

ibm-gpu = ["qiskit-aer[gpu]>=0.17.2"]

dev = ["pytest>=9.0.1",
    "pytest-cov>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["qsplit*"]
namespaces = false
