[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qsplit"
version = "0.1.0"
description = "TODO"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.3.4",
    "pandas==2.3.3",
    "pymetis>=2025.2.2",
    "scipy==1.17.1",
]

[project.optional-dependencies]

ibm-core = ["qiskit-algorithms==0.4.0", "qiskit-ibm-runtime==0.43.1"]

dwave = ["dwave-system==1.34.0"]

ibm-cpu = ["qiskit>=2.1.2", "qsplit[ibm-core]", "qiskit-aer==0.17.2"]

ibm-gpu = ["qiskit==1.4.1", "qsplit[ibm-core]", "qiskit-aer-gpu-cu11==0.17.2"]

iqm = ["iqm-client[qiskit]==33.0.4; python_version < '3.13'", "qiskit-algorithms==0.4.0"]

quantinuum = ["qnexus>=0.40.1", "pytket>=2.13.0", "pytket-qiskit>=0.77.0"]

cudaq = ["cudaq>=0.13.0"]

dev = [
    "dwave-system==1.34.0",
    "qiskit>=2.1.2",
    "qiskit-algorithms==0.4.0",
    "qiskit-ibm-runtime==0.43.1",
    "qiskit-aer==0.17.2",
    "pytest==9.0.1",
    "pytest-cov==7.0.0",
    "coverage>=7.10.6",
    "pre-commit>=4.5.1",
    "ruff>=0.14.13",
]

dataset = [
    "pennylane==0.44.0",
    "gast>=0.6.0",  # Imported by PennyLane 0.44's autograph module.
    "networkx==3.6.1",
    "tqdm==4.67.1",
    "h5py>=3.15.1",
    "aiohttp==3.13.3",
    "fsspec>=2025.3.0",
    "dwave-system==1.34.0",
    "matplotlib>=3.10.8",
]

streamflow = ["streamflow>=0.2.0dev13"]

[tool.uv]
conflicts = [
    [
        { extra = "ibm-cpu" },
        { extra = "ibm-gpu" },
    ],
    [
        { extra = "ibm-gpu" },
        { extra = "dev" },
    ],
    [
        { extra = "ibm-gpu" },
        { extra = "quantinuum" },
    ],
    [
        { extra = "iqm" },
        { extra = "streamflow" },
    ],
    [
        { extra = "iqm" },
        { extra = "quantinuum" },
    ],

]

[project.scripts]
cli_split = "qsplit.cwl.cli.split:main"
cli_scatter = "qsplit.cwl.cli.scatter:main"
cli_aggregate = "qsplit.cwl.cli.aggregate:main"
cli_dataset_prepare = "qsplit.cwl.cli.dataset_prepare:main"
cli_collect_dataset_results = "qsplit.cwl.cli.collect_dataset_results:main"
cli_persist_instance_solution = "qsplit.cwl.cli.persist_instance_solution:main"

[project.entry-points."unito.streamflow.plugin"]
qsplit = "streamflow.quantum.plugin.plugin:QSplitStreamFlowPlugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["qsplit*", "streamflow*"]
namespaces = false

[tool.setuptools.package-data]
"streamflow.quantum.plugin" = ["schemas/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: isolated behavior and error handling (no external services)",
    "integration: real components and CPU simulators working together",
    "e2e: public CLI and local CWL workflows in subprocesses",
    "quantinuum: requires the quantinuum extra (CPU Aer backend)",
    "dataset: dataset generators with local fixture data (requires dataset extra)",
    "iqm: requires the iqm extra (local fake-device simulator)",
    "cudaq: requires the cudaq extra (Linux CPU qpp target)",
    "streamflow: requires the streamflow extra (local execution only)",
]

[tool.coverage.run]
source = ["qsplit", "streamflow.quantum"]
branch = true
patch = ["subprocess"]
relative_files = true

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = "htmlcov"
