[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qsplit"
version = "0.1.0"
description = "TODO"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy==2.3.4", "pandas==2.3.3", "scipy==1.15.3"]

[project.optional-dependencies]

ibm = ["qiskit==2.1.2", "qiskit-algorithms==0.4.0", ]

ibm-quantum = ["qsplit[ibm]", "qiskit-ibm-runtime==0.43.1", ]

dwave = ["dwave-system==1.34.0"]

ibm-cpu = ["qsplit[ibm]", "qiskit-aer==0.17.2", ]

ibm-gpu = ["qsplit[ibm]", "qiskit-aer-gpu==0.15.1", ]

iqm = ["iqm-client[qiskit]==33.0.3", ]

dev = ["pytest==9.0.1", "pytest-cov==7.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qsplit*"]
namespaces = false
