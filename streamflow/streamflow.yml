version: v1.0

workflows:
  qsplit:
    type: cwl
    config:
      file: cwl/main.cwl
      settings: cwl/config.yml
    bindings:
      - step: /split
        target:
          deployment: qsplit-cpu
      - step: /parallelize
        target:
          deployment: qsplit-base
      - step: /aggregate
        target:
          deployment: qsplit-cpu

failureManager:
  type: default
  enabled: true
  config:
    max_retries: 5
    retry_delay: 10

deployments:

  qsplit-hpc4ai:
    type: ssh
    config:
      nodes:
        - username: fmedina
          hostname: c3sfr1.di.unito.it

  qsplit-slurm:
    type: slurm
    wraps: qsplit-hpc4ai
    workdir: /beegfs/home/fmedina/streamflow_workdir
    config:
      maxConcurrentJobs: 12
      services: 
        hpc4ai_gpu:
          file: templates/hpc4ai_gpu.sh
          partition: epito
        hpc4ai_cpu:
          file: templates/hpc4ai_cpu.sh
          partition: mirri
        hpc4ai_fallback:
          file: templates/hpc4ai_cpu.sh
          partition: broadwell

  qsplit-base:
    type: qsplit.quantum_connector
    wraps:
      deployment: qsplit-slurm
      service: hpc4ai_cpu
    config:
      provider: cudaq
      providerPool: ["cudaq"]
      providerServiceMap:
        dwave: hpc4ai_cpu
        ibm: hpc4ai_cpu
        ibm_gpu: hpc4ai_gpu
        cudaq: hpc4ai_gpu
      providerServiceFallbackMap:
        dwave: [hpc4ai_fallback]
        ibm: [hpc4ai_fallback]
      providerMaxJobs:
        dwave: 8
        ibm: 8
        ibm_gpu: 8
      cacheTTL: 60

  qsplit-cpu:
    type: qsplit.quantum_connector
    wraps:
      deployment: qsplit-slurm
      service: hpc4ai_cpu
    config:
      provider: dwave
      providerPool: ["dwave"]
      providerServiceMap:
        dwave: hpc4ai_cpu
      providerServiceFallbackMap:
        dwave: [hpc4ai_fallback]
      providerMaxJobs:
        dwave: 12
      cacheTTL: 60
