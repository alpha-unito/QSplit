version: v1.0

workflows:
  qsplit:
    type: cwl
    config:
      file: cwl/main.cwl
      settings: cwl/config.yml
    bindings:
      - step: /prepare_dataset
        target:
          deployment: qsplit-maintenance-local
      - step: /qsplit_instances/split
        target:
          deployment: qsplit-cpu
      - step: /qsplit_instances/parallelize
        target:
          deployment: qsplit-base
      - step: /qsplit_instances/iqm
        target:
          deployment: qsplit-iqm-local
      - step: /qsplit_instances/persist_solution
        target:
          deployment: qsplit-maintenance-local
      - step: /qsplit_instances/aggregate
        target:
          deployment: qsplit-cpu
      - step: /collect_results
        target:
          deployment: qsplit-maintenance-local

failureManager:
  type: default
  enabled: true
  config:
    max_retries: 5
    retry_delay: 10

deployments:

  qsplit-maintenance-local:
    type: local
    config: {}

  qsplit-hpc4ai:
    type: ssh
    config:
      nodes:
        - username: fmedina
          hostname: c3sfr1.di.unito.it

  qsplit-slurm:
    type: slurm
    wraps: qsplit-hpc4ai
    workdir: /beegfs/home/fmedina/streamflow_workdir
    config:
      maxConcurrentJobs: 12
      services: 
        hpc4ai_gpu:
          file: templates/hpc4ai_gpu.sh
          partition: epito
        hpc4ai_cpu:
          file: templates/hpc4ai_cpu.sh
          partition: broadwell
        hpc4ai_fallback:
          file: templates/hpc4ai_cpu.sh
          partition: cascadelake

  qsplit-base:
    type: qsplit.quantum_connector
    wraps:
      deployment: qsplit-slurm
      service: hpc4ai_cpu
    config:
      provider: dwave
      providerPool: ["dwave", "ibm", "cudaq"]
      providerServiceMap:
        dwave: hpc4ai_cpu
        ibm: hpc4ai_cpu
        ibm_gpu: hpc4ai_gpu
        cudaq: hpc4ai_gpu
      providerServiceFallbackMap:
        dwave: [hpc4ai_fallback]
        ibm: [hpc4ai_fallback]
      maxConcurrentJobs:
        dwave: 8
        ibm: 8
        cudaq: 4
        ibm_gpu: 8

  qsplit-cpu:
    type: qsplit.quantum_connector
    wraps:
      deployment: qsplit-slurm
      service: hpc4ai_cpu
    config:
      provider: dwave
      providerPool: ["dwave"]
      providerServiceMap:
        dwave: hpc4ai_cpu
      providerServiceFallbackMap:
        dwave: [hpc4ai_fallback]
      maxConcurrentJobs:
        dwave: 12

  qsplit-iqm-local:
    type: qsplit.quantum_connector
    config:
      provider: iqm
      providerPool: ["iqm"]
      maxConcurrentJobs:
        iqm: 1
      providerEnvMap:
        iqm:
          VIRTUAL_ENV: ${QSPLIT_IQM_VENV}
          PATH: ${QSPLIT_IQM_VENV}/bin:${PATH}
          PYTHONNOUSERSITE: "1"
          IQM_SERVER_URL: https://resonance.meetiqm.com/
          IQM_TOKEN: ${IQM_TOKEN}
          IQM_QUANTUM_COMPUTER: garnet
          QSPLIT_IQM_BACKEND: ${QSPLIT_IQM_BACKEND}
          QSPLIT_IQM_FALLBACK_TIMEOUT_SEC: "0"

