version: v1.0

workflows:
  qsplit:
    type: cwl
    config:
      file: cwl/main.cwl
      settings: cwl/config.yml
    bindings:
      - step: /split
        target:
          deployment: qsplit-base

      - step: /parallelize
        target:
          - deployment: qsplit-dwave
          - deployment: qsplit-ibm
          - deployment: qsplit-iqm
          - deployment: qsplit-base
        filters:
          - subqubo-routing

      - step: /aggregate
        target:
          deployment: qsplit-dwave

bindingFilters:
  subqubo-routing:
    type: matching
    config:
      filters:
        - target:
            deployment: qsplit-dwave
          job:
            - port: backend
              match: "classic"
        - target:
            deployment: qsplit-base
          job:
            - port: backend
              match: "dummy"
        - target:
            deployment: qsplit-dwave
          job:
            - port: backend
              match: "dwave"

        - target:
            deployment: qsplit-ibm
          job:
            - port: backend
              match: "ibm"

        - target:
            deployment: qsplit-iqm
          job:
            - port: backend
              match: "iqm"

deployments:
  qsplit-base:
    type: docker
    config:
      image: qsplit-base:latest
      workdir: /workspace
      volume:
        - .:/workspace

  qsplit-dwave:
    type: docker
    config:
      image: qsplit-dwave:latest
      workdir: /workspace
      volume:
        - .:/workspace

  qsplit-ibm:
    type: docker
    config:
      image: qsplit-ibm:latest
      workdir: /workspace
      volume:
        - .:/workspace

  qsplit-iqm:
    type: docker
    config:
      image: qsplit-dwave:latest
      workdir: /workspace
      volume:
        - .:/workspace
