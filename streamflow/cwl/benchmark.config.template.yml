benchmark_request:
  class: File
  path: benchmark.all.request.template.yaml
qoblib_repository:
  class: Directory
  path: /absolute/path/to/QOBLIB
solutions_store_dir: /absolute/path/to/benchmark-run/solutions
cut_dim: 16
split_method: recursive_graph
aggregate_method: auto
refinement_method: consensus
refinement_loops: 2
parallel_configs:
  - class: File
    path: benchmark.solver.yaml
refinement_solver_configs:
  - class: File
    path: benchmark.solver.yaml
