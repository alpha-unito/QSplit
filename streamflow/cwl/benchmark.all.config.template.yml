benchmark_request:
  class: File
  path: benchmark.all.request.template.yaml
qoblib_repository:
  class: Directory
  path: /absolute/path/to/QOBLIB
solutions_store_dir: /absolute/path/to/benchmark-all/solutions
# Maximum block size sent to the solver (independent of conversion limits).
cut_dim: 10
split_method: quadtree
aggregate_method: auto
refinement_method: conditioned
refinement_loops: 5
parallel_configs:
  - class: File
    path: benchmark.solver.yaml
refinement_solver_configs:
  - class: File
    path: benchmark.solver.yaml
